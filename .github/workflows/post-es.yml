name: Post ES TikToks

on:
  schedule:
    # ES only: Monday at 12:00 Europe/Helsinki (1=Mon).
    - cron: "0 12 * * 1"
      timezone: Europe/Helsinki
  workflow_dispatch: # allow manual runs from GitHub UI

jobs:
  post-es:
    name: Post ES Videos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ES posting script
        run: node postVideos.js es
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          SHEET_ID_ES: ${{ secrets.SHEET_ID_ES }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          BLOTATO_ACCOUNT_ID_ES: ${{ secrets.BLOTATO_ACCOUNT_ID_ES }}
