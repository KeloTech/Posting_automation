name: Post US TikToks

on:
  schedule:
    - cron: "0 20 * * 2"
      timezone: Europe/Helsinki
    - cron: "0 20 * * 3"
      timezone: Europe/Helsinki
    - cron: "0 21 * * 3"
      timezone: Europe/Helsinki
    - cron: "0 20 * * 4"
      timezone: Europe/Helsinki
    - cron: "0 21 * * 4"
      timezone: Europe/Helsinki
    - cron: "0 22 * * 4"
      timezone: Europe/Helsinki
    - cron: "0 23 * * 4"
      timezone: Europe/Helsinki
    - cron: "0 20 * * 5"
      timezone: Europe/Helsinki
    - cron: "0 21 * * 5"
      timezone: Europe/Helsinki
    - cron: "0 22 * * 5"
      timezone: Europe/Helsinki
    - cron: "0 23 * * 5"
      timezone: Europe/Helsinki
    - cron: "0 20 * * 6"
      timezone: Europe/Helsinki
    - cron: "0 21 * * 6"
      timezone: Europe/Helsinki
    - cron: "0 22 * * 6"
      timezone: Europe/Helsinki
    - cron: "0 23 * * 6"
      timezone: Europe/Helsinki
    - cron: "0 20 * * 0"
      timezone: Europe/Helsinki
  workflow_dispatch:

jobs:
  post:
    name: Post US TikToks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run US posting script
        run: node postVideos.js us
        env:
          CI: "true"
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          SHEET_ID_US: ${{ secrets.SHEET_ID_US }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          BLOTATO_ACCOUNT_ID_US: ${{ secrets.BLOTATO_ACCOUNT_ID_US }}
