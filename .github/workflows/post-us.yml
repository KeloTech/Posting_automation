name: Post US + BR TikToks

on:
  schedule:
    # Blotato: max 3 unique accounts per rolling 24h — staggered from EU (Tue/Fri 12:00 Helsinki).
    # US+BR: Wednesday and Saturday at 20:00 Europe/Helsinki (3=Wed, 6=Sat).
    - cron: "0 20 * * 3,6"
      timezone: Europe/Helsinki
  workflow_dispatch: # allow manual runs from GitHub UI

jobs:
  post-us:
    name: Post US + BR Videos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run US + BR posting script
        run: node postVideos.js us
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          SHEET_ID_US: ${{ secrets.SHEET_ID_US }}
          SHEET_ID_BR: ${{ secrets.SHEET_ID_BR }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          BLOTATO_ACCOUNT_ID_US: ${{ secrets.BLOTATO_ACCOUNT_ID_US }}
          BLOTATO_ACCOUNT_ID_BR: ${{ secrets.BLOTATO_ACCOUNT_ID_BR }}
