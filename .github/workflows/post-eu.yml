name: Post FI + DE TikToks

on:
  schedule:
    # FI+DE: Wednesday-Saturday at 12:00 Europe/Helsinki (3=Wed, 6=Sat).
    - cron: "0 12 * * 3-6"
      timezone: Europe/Helsinki
  workflow_dispatch: # allow manual runs from GitHub UI

jobs:
  post-fi-de:
    name: Post FI + DE Videos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run FI + DE posting script
        run: node postVideos.js fi_de
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          SHEET_ID_FI: ${{ secrets.SHEET_ID_FI }}
          SHEET_ID_DE: ${{ secrets.SHEET_ID_DE }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          BLOTATO_ACCOUNT_ID_FI: ${{ secrets.BLOTATO_ACCOUNT_ID_FI }}
          BLOTATO_ACCOUNT_ID_DE: ${{ secrets.BLOTATO_ACCOUNT_ID_DE }}
